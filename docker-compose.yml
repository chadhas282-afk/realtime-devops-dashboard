version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: devops-dashboard-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: devops_dashboard
    volumes:
      - mongo_data:/data/db
    networks:
      - dashboard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-dashboard-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/devops_dashboard
      JWT_SECRET: supersecretjwtkey_changeme
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - dashboard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-dashboard-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WS_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - dashboard-network

volumes:
  mongo_data:

networks:
  dashboard-network:
    driver: bridge
